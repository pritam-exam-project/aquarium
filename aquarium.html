<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Aquarium</title>
    <link rel="stylesheet" href="aquarium.css" />
  </head>
  <body>
    <!--Aquarium-Container-->
    <div id="aquarium-container">
      <!--Div for air space on aquarium above water-->
      <div id="air-space"></div>
      <!--Div for water and fish-->
      <div id="water-container">
        <img
          id="fish-1"
          class="small-fish"
          src="images/aquafishart-07.png"
          alt="Small fish swimming in the aquarium"
        />
        <img
          id="fish-2"
          class="medium-fish"
          src="images/aquafishart-03.png"
          alt="Medium fish swimming in the aquarium"
        />
        <img
          id="fish-3"
          class="large-fish"
          src="images/aquafishart-09.png"
          alt="Large fish swimming in the aquarium"
        />
        <img
          id="fish-4"
          class="small-fish"
          src="images/aquafishart-09.png"
          alt="Small fish swimming in the aquarium"
        />
        <img
          id="fish-5"
          class="small-fish"
          src="images/aquafishart-09.png"
          alt="Small fish swimming in the aquarium"
        />
        <img
          id="fish-6"
          class="medium-fish"
          src="images/aquafishart-12.png"
          alt="Medium fish swimming in the aquarium"
        />
        <img
          id="fish-7"
          class="large-fish"
          src="images/aquafishart-06.png"
          alt="Large fish swimming in the aquarium"
        />
        <img
          id="fish-8"
          class="large-fish"
          src="images/aquafishart-10.png"
          alt="Large fish swimming in the aquarium"
        />
        <img
          id="fish-9"
          class="medium-fish"
          src="images/aquafishart-01.png"
          alt="Medium fish swimming in the aquarium"
        />
      </div>
      <!--Div for bottom and contents -->
      <div id="bottom">
        <div id="green-coral">
          <img
            id="coral-1"
            class="coral"
            src="images/aquadecoart-08.png"
            alt="Green coral decoration"
          />
          <img
            id="coral-2"
            class="coral"
            src="images/aquadecoart-08.png"
            alt="Green coral decoration"
          />
          <img
            id="coral-3"
            class="coral"
            src="images/aquadecoart-08.png"
            alt="Green coral decoration"
          />
        </div>
        <img
          id="shell-1"
          class="shell"
          src="images/aquadecoart-03.png"
          alt="Round shell"
        />
        <img
          id="decor"
          src="images/aquadecoart-01.png"
          alt="Stone decorations"
        />
        <img id="starfish" src="images/aquadecoart-05.png" alt="Starfish" />
        <img
          id="shell-2"
          class="shell"
          src="images/aquadecoart-06.png"
          alt="Pink shell"
        />
        <div id="bubbles-1" class="circle"></div>
        <div id="bubbles-2" class="circle"></div>
        <div id="bubbles-3" class="circle"></div>
        <img
          id="coral-4"
          class="coral"
          src="images/aquadecoart-11.png"
          alt="Pink coral decoration"
        />
        <img
          id="coral-5"
          class="coral"
          src="images/aquadecoart-09.png"
          alt="Yellow coral decoration"
        />
      </div>
    </div>
  </body>
</html>
